<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F2A44">
<title>Visitas Fidola</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#0F2A44;color:#F3F8FB;font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{width:100%;max-width:360px}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
p{margin:0 0 22px;color:rgba(243,248,251,.75)}
form{display:grid;gap:12px}
input[type=password]{width:100%;min-height:52px;padding:0 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:inherit;font:inherit}
label.chk{display:flex;align-items:center;gap:10px;min-height:44px;color:rgba(243,248,251,.85);font-size:15px}
label.chk input{width:22px;height:22px;accent-color:#7DB2FF}
button{min-height:52px;border-radius:12px;border:0;background:#F3F8FB;color:#0F2A44;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:3px solid #7DB2FF;outline-offset:2px}
#err{min-height:22px;margin:0;color:#FFB4AE;font-size:15px}
</style>
</head>
<body>
<main id="gate" hidden>
  <h1>Visitas Fidola</h1>
  <p>Escribe tu contraseña para entrar.</p>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" required>
    <label class="chk"><input id="rem" type="checkbox" checked> Recordar en este dispositivo</label>
    <button id="go" type="submit">Entrar</button>
    <p id="err" role="alert"></p>
  </form>
</main>

  var STORE = 'fidola_gate_' + P.salt.replace(/[^A-Za-z0-9]/g, '').slice(0, 12);
  var $ = function (id) { return document.getElementById(id); };
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var toB64 = function (buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); };

  if (!window.crypto || !crypto.subtle) {
    $('gate').hidden = false;
    $('err').textContent = 'Este navegador no puede descifrar aquí. Abre la página desde https.';
    $('f').hidden = true;
    return;
  }
  function deriveKey(pw, extractable) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, extractable, ['decrypt']);
    });
  }
  function openWith(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)).then(function (pt) {
      var html = new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
    });
  }
  function ask() { $('gate').hidden = false; $('pw').focus(); }

  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) { /* sin almacenamiento */ }
  if (saved) {
    crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt'])
      .then(openWith)
      .catch(function () { try { localStorage.removeItem(STORE); } catch (e) { /* nada */ } ask(); });
  } else ask();

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('pw').value, remember = $('rem').checked;
    $('err').textContent = ''; $('go').disabled = true; $('go').textContent = 'Entrando…';
    deriveKey(pw, remember).then(function (key) {
      return openWith(key).then(function () {
        if (!remember) return;
        return crypto.subtle.exportKey('raw', key).then(function (raw) {
          try { localStorage.setItem(STORE, toB64(raw)); } catch (e) { /* nada */ }
        });
      });
    }).catch(function () {
      $('err').textContent = 'Contraseña incorrecta.';
      $('go').disabled = false; $('go').textContent = 'Entrar'; $('pw').select();
    });
  });
